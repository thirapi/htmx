<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go + HTMX</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <h1>Hello, Go + HTMX!</h1>
    
    <button hx-get="/api/time" hx-swap="innerHTML" hx-target="#time-display">
        Get Current Time
    </button>
    
    <div id="time-display"></div>
</body>
</html>
